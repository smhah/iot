apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wil-playground-bonus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/root/smhah.git
    targetRevision: HEAD
    path: dev
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
    
    syncOptions:
      - CreateNamespace=true
