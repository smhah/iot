apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minimal-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
      paths:
      - path: /app-one-nodeport
        pathType: Prefix
        backend:
          service:
            name: app-one-nodeport
            port:
              number: 80
      - path: /app-two-nodeport
        pathType: Prefix
        backend:
          service:
            name: app-two-nodeport
            port:
              number: 80
      - path: /app-one
        pathType: Prefix
        backend:
          service:
            name: app-one
            port:
              number: 80
      - path: /app-two
        pathType: Prefix
        backend:
          service:
            name: app-two
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-one
            port:
              number: 80
      